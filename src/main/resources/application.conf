# Azure ADLS Gen2 Configuration
azure {
  storageAccount = "your-storage-account"
  container = "your-container"
  clientId = "your-client-id"
  tenantId = "your-tenant-id"
  clientSecret = "your-client-secret"
}

# Spark Configuration
spark {
  master = "local[*]"
  appName = "DataProcessApp"
  executorMemory = "2g"
  driverMemory = "2g"
}

# Path Configuration
paths {
  input = "data/input"
  output = "data/output"
}